<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejador de Negócio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: livro-razão em duas colunas — índice de abas à esquerda, folha de trabalho à direita. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --surface-2: #e9eee9;
  --ink: #15201b;
  --ink-2: #48564e;
  --muted: #76837b;
  --line: #d6ddd7;
  --accent: #0e6a54;
  --accent-soft: #d5ebe3;
  --accent-ink: #ffffff;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --good: #1d7f46;
  --good-bg: #dcf1e3;
  --warn: #9a6200;
  --warn-bg: #fbecc9;
  --bad: #b83535;
  --bad-bg: #f8dddd;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #171e1b; --surface-2: #1e2723; --ink: #ecf2ee; --ink-2: #b4c1b9;
    --muted: #84918a; --line: #2b3631; --accent: #3bbd96; --accent-soft: #173a30; --accent-ink: #08130f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #5fd08f; --good-bg: #163524; --warn: #f0b443; --warn-bg: #3a2c0e; --bad: #f07a7a; --bad-bg: #3d1a1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #171e1b; --surface-2: #1e2723; --ink: #ecf2ee; --ink-2: #b4c1b9;
  --muted: #84918a; --line: #2b3631; --accent: #3bbd96; --accent-soft: #173a30; --accent-ink: #08130f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #5fd08f; --good-bg: #163524; --warn: #f0b443; --warn-bg: #3a2c0e; --bad: #f07a7a; --bad-bg: #3d1a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 8px; }
.brand small { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.brand strong { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.2; }
nav.tabs { display: flex; flex-direction: column; gap: 2px; }
nav.tabs button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
nav.tabs button .k { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 18px; }
nav.tabs button:hover { background: var(--surface-2); color: var(--ink); }
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
nav.tabs button[aria-selected="true"] .k { color: var(--accent); }
nav.tabs button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }

main { padding-block: 24px 64px; padding-inline: clamp(16px, 3vw, 40px); min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.head .eyebrow { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.head p.lead { color: var(--ink-2); max-width: 70ch; margin-top: 4px; }
.example-note { font-size: 12px; color: var(--warn); background: var(--warn-bg); padding: 6px 10px; border-radius: 6px; }

.stack { display: flex; flex-direction: column; gap: 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel > header p { color: var(--muted); font-size: 12.5px; }
.hint { color: var(--muted); font-size: 12.5px; }

label.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label.f > span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
label.f > small { color: var(--muted); font-size: 11.5px; }
.in { position: relative; display: flex; align-items: center; }
.in em { position: absolute; right: 9px; font-style: normal; color: var(--muted); font-size: 12px; pointer-events: none; }
.in em.pre { left: 9px; right: auto; }
.in em.pre + input { padding-left: 30px; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; text-align: right; padding-right: 34px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
textarea { resize: vertical; min-height: 74px; line-height: 1.45; }
input:hover, textarea:hover, select:hover { border-color: var(--muted); }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); padding: 7px 8px; white-space: nowrap; }
td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
td.n, th.n { text-align: right; }
td.out { padding: 7px 8px; white-space: nowrap; }
td input, td select { background: transparent; border-color: transparent; padding: 5px 6px; }
td input[type="number"] { padding-right: 6px; }
td input:hover, td select:hover { border-color: var(--line); }
td input:focus, td select:focus { background: var(--bg); }
tr.total td { font-weight: 600; background: var(--surface-2); }
tr.sub td { color: var(--ink-2); }
table.ro td { padding: 7px 8px; white-space: nowrap; }
table.ro td:first-child { white-space: normal; min-width: 180px; }
.neg { color: var(--bad); }
.pos { color: var(--good); }

.btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
.btn.ghost:hover { color: var(--bad); }
.btn.sm { font-size: 12px; padding: 5px 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .l { font-size: 11px; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
.kpi .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .d { font-size: 12px; color: var(--ink-2); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); background: var(--good-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }

.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.verdict .badge { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; padding: 10px 16px; border-radius: 8px; }
.verdict .badge.good { color: var(--good); background: var(--good-bg); }
.verdict .badge.warn { color: var(--warn); background: var(--warn-bg); }
.verdict .badge.bad { color: var(--bad); background: var(--bad-bg); }

.checks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.checks li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.checks li:first-child { border-top: 0; }
.checks li small { grid-column: 1 / -1; color: var(--muted); }

.chart { position: relative; height: 270px; }
.chart.tall { height: 320px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.prod { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.prod > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; justify-content: space-between; }
.prod > summary::-webkit-details-marker { display: none; }
.prod > summary h3::before { content: "▸ "; color: var(--muted); }
.prod[open] > summary h3::before { content: "▾ "; }
.prod > summary .meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--ink-2); }
.prod > summary .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.prod .body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.breakdown div { background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.breakdown span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.breakdown b { font-variant-numeric: tabular-nums; font-size: 15px; }
.breakdown .hl { background: var(--accent-soft); }

.side-label { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 2px 0; }
.brand img { max-width: 120px; max-height: 44px; object-fit: contain; margin-bottom: 6px; align-self: flex-start; }
.logo-row { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 20px; align-items: start; }
.logo-box { aspect-ratio: 4 / 3; max-width: 100%; border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; padding: 14px; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; color: var(--muted); font-size: 12.5px; text-align: center; }
.logo-box img { max-width: 100%; max-height: 140px; object-fit: contain; }
input[type="color"] { width: 64px; height: 36px; padding: 3px; cursor: pointer; }
.btn[data-busy] { opacity: .65; pointer-events: none; }
.saz { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 10; }
.mobilebar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; padding: 10px 16px; gap: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0; }
  .brand small { display: none; }
  nav.tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  nav.tabs button { white-space: nowrap; padding: 6px 10px; }
  nav.tabs button .k { display: none; }
  .side-foot { display: none; }
  .mobilebar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .logo-row { grid-template-columns: minmax(0, 1fr); }
  .side-label { display: none; }
}
@media print {
  .side, .mobilebar, .btn, .toast { display: none !important; }
  .app { display: block; }
  main { padding: 0; }
  body { background: #fff; color: #000; }
  .panel, .kpi, .prod, .verdict { break-inside: avoid; }
  input, textarea, select { border: 0; background: transparent; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: in .18s ease-out; }
  @keyframes in { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img id="brandLogo" alt="" hidden><small>Plano de negócio</small><strong id="brandName">—</strong></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Seções do plano"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main"></main>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>

/* ---------- formatação ---------- */
const fBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fBRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fN = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const fN1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const brl = v => Number.isFinite(v) ? fBRL.format(v) : '—';
const brl0 = v => Number.isFinite(v) ? fBRL0.format(v) : '—';
const kbrl = v => !Number.isFinite(v) ? '—' : Math.abs(v) >= 1e6 ? 'R$ ' + fN1.format(v / 1e6) + ' mi' : Math.abs(v) >= 1e4 ? 'R$ ' + fN1.format(v / 1e3) + ' mil' : brl0(v);
const pct = (v, d = 1) => Number.isFinite(v) ? (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: d, minimumFractionDigits: d }) + '%' : '—';
const num = v => Number.isFinite(v) ? fN.format(v) : '—';
const meses = v => !Number.isFinite(v) ? 'não retorna' : v < 12 ? fN1.format(v) + ' meses' : `${fN1.format(v)} meses (${fN1.format(v / 12)} anos)`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => (a || []).reduce((t, x) => t + (Number(f(x)) || 0), 0);
const n = v => Number(v) || 0;
const sg = v => v < 0 ? 'neg' : '';

/* ---------- cálculos ---------- */
function npv(rate, flows) { return flows.reduce((t, f, i) => t + f / Math.pow(1 + rate, i), 0); }
function irr(flows) {
  let lo = -0.99, hi = 1;
  let flo = npv(lo, flows), fhi = npv(hi, flows);
  if (!(flo * fhi < 0)) return NaN;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2, fm = npv(mid, flows);
    if (Math.abs(fm) < 1e-7) return mid;
    if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}
function payback(flows) {
  let acc = flows[0];
  if (acc >= 0) return 0;
  for (let m = 1; m < flows.length; m++) {
    const prev = acc; acc += flows[m];
    if (acc >= 0) return m - 1 + (-prev) / flows[m];
  }
  return NaN;
}

function compute(s) {
  const P = s.premissas, O = s.operacional, I = s.investimento, M = s.mvp;
  const H = Math.max(12, Math.min(120, Math.round(n(P.horizonte)) || 60));
  // canais e custos variáveis sobre a venda
  const partTot = sum(s.comercial.canais, c => c.part);
  const taxaCanais = partTot > 0 ? sum(s.comercial.canais, c => n(c.part) * n(c.taxa)) / partTot / 100 : 0;
  const varPct = n(P.impostosPct) / 100 + n(P.comissaoPct) / 100 + taxaCanais;
  // custos fixos
  const folha = sum(O.equipe, e => n(e.qtd) * n(e.salario)) * (1 + n(O.encargosPct) / 100);
  const fixosItens = sum(O.custosFixos, c => c.valor);
  const mkt = sum(s.marketing.orcamento, o => o.valor);
  const deprec = sum(I.fixos, f => n(f.vida) > 0 ? n(f.qtd) * n(f.valor) / (n(f.vida) * 12) : 0);
  const fixoCaixa = folha + fixosItens + mkt;
  const fixoTotal = fixoCaixa + deprec;
  // MVP
  const mvpFeat = (M.features || []).map(f => ({ ...f, total: n(f.horas) * n(M.custoHora) + n(f.custo) }));
  const mvpSel = mvpFeat.filter(f => f.incluir);
  const mvpCusto = sum(mvpSel, f => f.total) + n(M.marketingTeste);
  const mvpHoras = sum(mvpSel, f => f.horas);
  const mvpSemanas = n(M.horasSemana) > 0 ? mvpHoras / n(M.horasSemana) : NaN;
  const mvpPedidos = n(M.alcance) * n(M.conversaoPct) / 100;
  const mvpReceita = mvpPedidos * n(M.ticketTeste);
  const mvpCac = mvpPedidos > 0 ? n(M.marketingTeste) / mvpPedidos : NaN;
  // produtos — custo direto
  const custoMin = n(O.custoHoraMO) / 60;
  const prods = s.produtos.map(p => {
    const insumos = sum(p.insumos, i => n(i.qtd) * n(i.custo));
    const mo = n(p.minutosMO) * custoMin;
    const cd = insumos + mo + n(p.embalagem) + n(p.outros);
    return { p, insumos, mo, cd };
  });
  // sazonalidade e volume
  const saz = (s.comercial.sazonalidade || []).map(v => n(v) / 100);
  const mesIni = (() => { const m = /^(\d{4})-(\d{2})/.exec(s.empresa.inicio || ''); return m ? +m[2] - 1 : 0; })();
  const anoIni = (() => { const m = /^(\d{4})/.exec(s.empresa.inicio || ''); return m ? +m[1] : new Date().getFullYear(); })();
  const qty = (p, m) => n(p.vendasMes1) * Math.pow(1 + n(p.crescimentoPct) / 100, Math.min(m, Math.max(1, n(P.mesesCrescimento))) - 1) * (saz.length === 12 ? (saz[(mesIni + m - 1) % 12] || 0) : 1);
  // rateio de custo fixo no preço (ponto fixo)
  const precoCom = (x, f) => {
    if (n(x.p.precoManual) > 0) return n(x.p.precoManual);
    const den = 1 - varPct - f - n(x.p.margemPct) / 100;
    return den > 0.05 ? x.cd / den : NaN;
  };
  const maxF = Math.max(0, 0.95 - varPct - Math.max(0, ...prods.map(x => n(x.p.margemPct) / 100)));
  let f = Math.min(0.15, maxF), rateioOk = true;
  for (let it = 0; it < 200; it++) {
    let R = 0;
    for (const x of prods) { const pr = precoCom(x, f); for (let m = 1; m <= 12; m++) R += (pr || 0) * qty(x.p, m); }
    R /= 12;
    const fNew = R > 0 ? fixoTotal / R : maxF;
    const next = Math.min(maxF, (f + fNew) / 2);
    if (Math.abs(next - f) < 1e-7) { f = next; break; }
    f = next;
  }
  {
    let R = 0;
    for (const x of prods) { const pr = precoCom(x, f); for (let m = 1; m <= 12; m++) R += (pr || 0) * qty(x.p, m); }
    if (R <= 0 || fixoTotal / (R / 12) > f + 0.002) rateioOk = false;
  }
  const rateioPct = f;
  prods.forEach(x => {
    const den = 1 - varPct - rateioPct - n(x.p.margemPct) / 100;
    x.markup = den > 0.05 ? 1 / den : NaN;
    x.sugerido = den > 0.05 ? x.cd / den : NaN;
    x.preco = n(x.p.precoManual) > 0 ? n(x.p.precoManual) : x.sugerido;
    x.mcUnit = x.preco * (1 - varPct) - x.cd;
    x.mcPct = x.preco > 0 ? x.mcUnit / x.preco : NaN;
    x.margemReal = x.preco > 0 ? (x.preco * (1 - varPct - rateioPct) - x.cd) / x.preco : NaN;
  });
  // investimento
  const invFixos = sum(I.fixos, x => n(x.qtd) * n(x.valor));
  const invPreop = sum(I.preop, x => x.valor);
  const invGiro = n(I.mesesGiro) * fixoCaixa;
  const invMvp = I.incluirMvp ? mvpCusto : 0;
  const invTotal = invFixos + invPreop + invGiro + invMvp;
  const finV = Math.min(n(I.fin.valor), invTotal);
  const proprio = invTotal - finV;
  // financiamento (Price com carência de juros)
  const fi = n(I.fin.taxa) / 100, fPrazo = Math.max(0, Math.round(n(I.fin.prazo))), fCar = Math.min(Math.max(0, Math.round(n(I.fin.carencia))), fPrazo);
  const nAm = fPrazo - fCar;
  const pmt = finV > 0 && nAm > 0 ? (fi > 0 ? finV * fi / (1 - Math.pow(1 + fi, -nAm)) : finV / nAm) : 0;
  let saldo = finV;
  // TMA
  const tmaM = Math.pow(1 + n(P.tmaAnual) / 100, 1 / 12) - 1;
  const irP = n(P.irPct) / 100;
  // projeção mensal
  const rows = [];
  let caixa = invGiro, acc = -invTotal, accD = -invTotal;
  const fluxos = [-invTotal];
  for (let m = 1; m <= H; m++) {
    const y = Math.floor((m - 1) / 12);
    const inf = Math.pow(1 + n(P.inflacaoAnual) / 100, y);
    let receita = 0, cpv = 0, unid = 0;
    const porProd = prods.map(x => {
      const q = qty(x.p, m), r = (x.preco || 0) * inf * q, c = x.cd * inf * q;
      receita += r; cpv += c; unid += q;
      return { q, r };
    });
    const ded = receita * varPct;
    const mc = receita - ded - cpv;
    const fixos = fixoCaixa * inf;
    const ebitda = mc - fixos;
    const ebit = ebitda - deprec;
    let juros = 0, amort = 0;
    if (saldo > 0.005 && m <= fPrazo) {
      juros = saldo * fi;
      if (m > fCar) { amort = Math.min(saldo, pmt - juros); }
      saldo -= amort;
    }
    const lair = ebit - juros;
    const ir = Math.max(0, lair) * irP;
    const ll = lair - ir;
    const fc = ebit - Math.max(0, ebit) * irP + deprec;
    acc += fc;
    const fcD = fc / Math.pow(1 + tmaM, m);
    accD += fcD;
    caixa += ll + deprec - amort;
    fluxos.push(fc);
    rows.push({ m, ano: y + 1, label: rotuloMes(anoIni, mesIni, m), receita, ded, cpv, mc, fixos, ebitda, deprec, ebit, juros, amort, lair, ir, ll, fc, acc, fcD, accD, caixa, unid, porProd, custosTot: ded + cpv + fixos + deprec + juros });
  }
  // anual
  const anos = [];
  for (let y = 1; y <= Math.ceil(H / 12); y++) {
    const rs = rows.filter(r => r.ano === y);
    const a = { ano: y, meses: rs.length };
    ['receita', 'ded', 'cpv', 'mc', 'fixos', 'ebitda', 'deprec', 'ebit', 'juros', 'amort', 'lair', 'ir', 'll', 'fc', 'unid'].forEach(k => a[k] = sum(rs, r => r[k]));
    a.caixaFim = rs.length ? rs[rs.length - 1].caixa : 0;
    a.accFim = rs.length ? rs[rs.length - 1].acc : 0;
    anos.push(a);
  }
  // indicadores
  const vpl = npv(tmaM, fluxos);
  const tirM = irr(fluxos);
  const tirA = Number.isFinite(tirM) && tirM > -0.95 ? Math.pow(1 + tirM, 12) - 1 : NaN;
  const pb = payback(fluxos);
  const fluxD = fluxos.map((v, i) => v / Math.pow(1 + tmaM, i));
  const pbD = payback(fluxD);
  const a1 = anos[0] || {};
  const mcPct1 = a1.receita > 0 ? a1.mc / a1.receita : NaN;
  const fixoMes1 = ((a1.fixos || 0) + (a1.deprec || 0)) / 12;
  const peR = mcPct1 > 0 ? fixoMes1 / mcPct1 : NaN;
  const peEcon = mcPct1 > 0 ? (fixoMes1 + invTotal * tmaM) / mcPct1 : NaN;
  const receitaMes1 = (a1.receita || 0) / 12;
  const margemSeg = receitaMes1 > 0 ? (receitaMes1 - peR) / receitaMes1 : NaN;
  const peUnid = prods.map((x, i) => {
    const share = a1.receita > 0 ? sum(rows.filter(r => r.ano === 1), r => r.porProd[i].r) / a1.receita : 0;
    return x.preco > 0 ? peR * share / x.preco : NaN;
  });
  const mesEquilibrio = (rows.find(r => r.ebit >= 0) || {}).m;
  const caixaMin = Math.min(invGiro, ...rows.map(r => r.caixa));
  const mesCaixaMin = rows.reduce((b, r) => r.caixa < b.caixa ? r : b, rows[0] || { m: 0, caixa: 0 }).m;
  const llMedioAno = sum(anos.filter(a => a.meses === 12), a => a.ll) / Math.max(1, anos.filter(a => a.meses === 12).length);
  const rentab = invTotal > 0 ? llMedioAno / invTotal : NaN;
  const roi = invTotal > 0 ? (sum(fluxos.slice(1), v => v) - invTotal) / invTotal : NaN;
  const lucrat1 = a1.receita > 0 ? a1.ll / a1.receita : NaN;
  const a2 = anos[1];
  const lucrat2 = a2 && a2.receita > 0 ? a2.ll / a2.receita : NaN;
  const maxUnid = Math.max(0, ...rows.map(r => r.unid));
  const capOk = !(n(O.capacidadeMensal) > 0) || maxUnid <= n(O.capacidadeMensal);
  const mesCapEstouro = n(O.capacidadeMensal) > 0 ? (rows.find(r => r.unid > n(O.capacidadeMensal)) || {}).m : undefined;
  // marketing
  const Mk = s.marketing;
  const cac = n(Mk.novosClientes) > 0 ? mkt / n(Mk.novosClientes) : NaN;
  const ltv = n(Mk.ticket) * n(Mk.freqAno) * n(Mk.anosRetencao) * (Number.isFinite(mcPct1) ? mcPct1 : 0);
  const ltvCac = cac > 0 ? ltv / cac : NaN;

  const checks = [
    { nome: 'Valor presente líquido (VPL) positivo', ok: vpl > 0 ? 'good' : 'bad', val: brl0(vpl), info: `Descontado à TMA de ${pct(n(P.tmaAnual) / 100)} a.a. em ${H} meses.` },
    { nome: 'TIR acima da TMA', ok: Number.isFinite(tirA) && tirA > n(P.tmaAnual) / 100 ? 'good' : 'bad', val: Number.isFinite(tirA) ? pct(tirA) + ' a.a.' : 'sem TIR', info: 'Taxa que zera o VPL do fluxo do projeto.' },
    { nome: 'Payback dentro do horizonte', ok: !Number.isFinite(pb) ? 'bad' : pb <= 36 ? 'good' : 'warn', val: meses(pb), info: 'Até 36 meses é considerado saudável para pequeno varejo.' },
    { nome: 'Caixa nunca fica negativo', ok: caixaMin >= 0 ? 'good' : 'bad', val: brl0(caixaMin), info: caixaMin >= 0 ? `Menor saldo no mês ${mesCaixaMin}.` : `Faltam ${brl0(-caixaMin)} de capital de giro (mês ${mesCaixaMin}).` },
    { nome: 'Margem de segurança no ano 1', ok: !Number.isFinite(margemSeg) ? 'bad' : margemSeg >= 0.2 ? 'good' : margemSeg >= 0 ? 'warn' : 'bad', val: pct(margemSeg), info: 'Quanto a receita média supera o ponto de equilíbrio. Acima de 20% é confortável.' },
    { nome: 'Capacidade produtiva atende a demanda', ok: capOk ? 'good' : 'warn', val: capOk ? 'Atende' : `Estoura no mês ${mesCapEstouro}`, info: `Pico de ${num(maxUnid)} unidades/mês contra capacidade de ${num(n(O.capacidadeMensal))}.` },
    { nome: 'LTV / CAC', ok: !Number.isFinite(ltvCac) ? 'warn' : ltvCac >= 3 ? 'good' : ltvCac >= 1 ? 'warn' : 'bad', val: Number.isFinite(ltvCac) ? fN1.format(ltvCac) + '×' : '—', info: 'Valor de um cliente dividido pelo custo para conquistá-lo. Meta: 3× ou mais.' },
    { nome: 'Preços cobrem custos e margem desejada', ok: rateioOk && prods.every(x => Number.isFinite(x.preco) && x.mcUnit > 0) ? 'good' : 'bad', val: rateioOk ? 'Sim' : 'Volume insuficiente', info: 'Markup consegue absorver custos variáveis, rateio dos fixos e margem.' }
  ];
  const bad = checks.filter(c => c.ok === 'bad').length, warn = checks.filter(c => c.ok === 'warn').length;
  const core = vpl > 0 && Number.isFinite(pb);
  const verdict = !core ? 'bad' : bad > 0 || warn > 1 ? 'warn' : 'good';

  return { H, taxaCanais, varPct, folha, fixosItens, mkt, deprec, fixoCaixa, fixoTotal, rateioPct, rateioOk, prods,
    mvp: { feats: mvpFeat, custo: mvpCusto, horas: mvpHoras, semanas: mvpSemanas, pedidos: mvpPedidos, receita: mvpReceita, cac: mvpCac },
    inv: { fixos: invFixos, preop: invPreop, giro: invGiro, mvp: invMvp, total: invTotal, fin: finV, proprio, pmt, nAm, fCar },
    rows, anos, fluxos, tmaM, vpl, tirM, tirA, pb, pbD, mcPct1, peR, peEcon, peUnid, margemSeg, receitaMes1, mesEquilibrio, caixaMin, mesCaixaMin,
    rentab, roi, lucrat1, lucrat2, maxUnid, capOk, cac, ltv, ltvCac, checks, verdict };
}
function rotuloMes(ano, mes0, m) {
  const d = mes0 + m - 1;
  const nomes = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  return nomes[d % 12] + '/' + String(ano + Math.floor(d / 12)).slice(2);
}

/* ---------- componentes de formulário ---------- */
function field(path, label, o = {}) {
  const v = getPath(path);
  const id = 'f-' + path.replace(/\./g, '-');
  let ctrl;
  if (o.type === 'textarea') ctrl = `<textarea id="${id}" data-path="${path}" rows="${o.rows || 3}">${esc(v)}</textarea>`;
  else if (o.type === 'number') ctrl = `<div class="in">${o.pre ? `<em class="pre">${o.pre}</em>` : ''}<input id="${id}" type="number" step="any" data-path="${path}" data-num value="${esc(v)}">${o.suf ? `<em>${o.suf}</em>` : ''}</div>`;
  else if (o.type === 'check') return `<label class="row" for="${id}"><input id="${id}" type="checkbox" data-path="${path}" ${v ? 'checked' : ''}><span>${label}</span></label>`;
  else ctrl = `<input id="${id}" type="${o.type || 'text'}" data-path="${path}" value="${esc(v)}">`;
  return `<label class="f" for="${id}"><span>${label}</span>${ctrl}${o.hint ? `<small>${o.hint}</small>` : ''}</label>`;
}
/* cols: {k, l, t:'text'|'num'|'sel'|'check', opts, w, calc:(row,i)=>html} */
function table(path, cols, o = {}) {
  const rows = getPath(path) || [];
  const key = path.split('.').pop();
  const head = cols.map(c => `<th class="${c.t === 'num' || c.calc ? 'n' : ''}" ${c.w ? `style="width:${c.w}"` : ''}>${c.l}</th>`).join('') + '<th style="width:36px"></th>';
  const body = rows.map((r, i) => '<tr>' + cols.map(c => {
    const p = `${path}.${i}.${c.k}`, id = 'f-' + p.replace(/\./g, '-');
    if (c.calc) return `<td class="n out" data-calc="${path}:${i}:${c.k}">${c.calc(r, i)}</td>`;
    if (c.t === 'num') return `<td><input id="${id}" aria-label="${c.l}" type="number" step="any" data-path="${p}" data-num value="${esc(r[c.k])}"></td>`;
    if (c.t === 'check') return `<td style="text-align:center"><input id="${id}" aria-label="${c.l}" type="checkbox" data-path="${p}" ${r[c.k] ? 'checked' : ''}></td>`;
    if (c.t === 'sel') return `<td><select id="${id}" aria-label="${c.l}" data-path="${p}">${c.opts.map(x => `<option ${x === r[c.k] ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></td>`;
    return `<td><input id="${id}" aria-label="${c.l}" data-path="${p}" value="${esc(r[c.k])}"></td>`;
  }).join('') + `<td><button class="btn ghost" data-del="${path}" data-i="${i}" aria-label="Remover linha" title="Remover">✕</button></td></tr>`).join('');
  const foot = o.total ? `<tr class="total"><td colspan="${o.totalSpan || 1}">Total</td><td class="n" data-calc="${path}:total" colspan="${cols.length - (o.totalSpan || 1)}">${o.total()}</td><td></td></tr>` : '';
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}${foot}</tbody></table></div>
    <div><button class="btn sm" data-add="${path}" data-tpl="${key}">+ Adicionar</button></div>`;
}
function panel(title, desc, inner, extra = '') { return `<section class="panel" ${extra}><header><h3>${title}</h3>${desc ? `<p>${desc}</p>` : ''}</header>${inner}</section>`; }
function kpi(l, v, d = '', cls = '') { return `<div class="kpi"><span class="l">${l}</span><span class="v ${cls}">${v}</span>${d ? `<span class="d">${d}</span>` : ''}</div>`; }

}

/* ---------- gráficos ---------- */
const charts = {};
function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function mkChart(id, cfg) {
  if (!window.Chart) return;
  const el = document.getElementById(id); if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, cfg);
}
function baseOpts(yFmt) {
  const ink = tok('--ink-2'), line = tok('--line');
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'index', intersect: false },
    plugins: { legend: { display: false }, tooltip: { backgroundColor: tok('--surface'), titleColor: tok('--ink'), bodyColor: tok('--ink-2'), borderColor: line, borderWidth: 1, padding: 10, boxPadding: 4,
      callbacks: { label: c => ` ${c.dataset.label}: ${brl0(c.parsed.y ?? c.parsed.x)}` } } },
    scales: {
      x: { grid: { display: false }, border: { color: line }, ticks: { color: ink, font: { family: 'IBM Plex Sans', size: 11 }, maxRotation: 0, autoSkipPadding: 14 } },
      y: { grid: { color: line }, border: { display: false }, ticks: { color: ink, font: { family: 'IBM Plex Sans', size: 11 }, callback: yFmt || (v => kbrl(v)) } }
    }
  };
}
function drawDashboard() {
  const s1 = tok('--s1'), s2 = tok('--s2'), s3 = tok('--s3'), surf = tok('--surface');
  const lbl = C.rows.map(r => r.label);
  mkChart('chRec', { type: 'line', data: { labels: lbl, datasets: [
    { label: 'Receita bruta', data: C.rows.map(r => r.receita), borderColor: s1, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: .25 },
    { label: 'Custos totais', data: C.rows.map(r => r.custosTot), borderColor: s2, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: .25 }
  ] }, options: baseOpts() });
  const accO = baseOpts();
  mkChart('chAcc', { type: 'line', data: { labels: ['início', ...lbl], datasets: [
    { label: 'Acumulado', data: [C.fluxos[0], ...C.rows.map(r => r.acc)], borderColor: s1, backgroundColor: s1 + '22', fill: 'origin', borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: .2 }
  ] }, options: accO, plugins: [zeroLine()] });
  mkChart('chAno', { type: 'bar', data: { labels: C.anos.map(a => 'Ano ' + a.ano), datasets: [
    { label: 'Receita bruta', data: C.anos.map(a => a.receita), backgroundColor: s1, borderRadius: 4, borderSkipped: 'bottom', maxBarThickness: 36, borderColor: surf, borderWidth: { left: 1, right: 1 } },
    { label: 'Lucro líquido', data: C.anos.map(a => a.ll), backgroundColor: s3, borderRadius: 4, borderSkipped: 'bottom', maxBarThickness: 36, borderColor: surf, borderWidth: { left: 1, right: 1 } }
  ] }, options: baseOpts(), plugins: [zeroLine()] });
  const r12 = C.rows[Math.min(11, C.rows.length - 1)];
  const juros = r12.juros;
  const items = [
    ['Insumos e produção (CPV)', r12.cpv], ['Impostos e taxas de venda', r12.ded], ['Folha com encargos', C.folha],
    ['Custos fixos operacionais', C.fixosItens], ['Marketing', C.mkt], ['Depreciação', C.deprec], ['Juros', juros]
  ].filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const o = baseOpts();
  o.indexAxis = 'y';
  o.interaction = { mode: 'nearest', axis: 'y', intersect: false };
  o.scales.x = { grid: { color: tok('--line') }, border: { display: false }, ticks: { color: tok('--ink-2'), font: { size: 11 }, callback: v => kbrl(v) } };
  o.scales.y = { grid: { display: false }, border: { color: tok('--line') }, ticks: { color: tok('--ink-2'), font: { family: 'IBM Plex Sans', size: 11 } } };
  o.plugins.tooltip.callbacks.label = c => ` ${brl0(c.parsed.x)}`;
  mkChart('chComp', { type: 'bar', data: { labels: items.map(x => x[0]), datasets: [{ label: 'Valor', data: items.map(x => x[1]), backgroundColor: s1, borderRadius: 4, borderSkipped: 'left', maxBarThickness: 22 }] }, options: o });
}
function drawPayback() {
  const s1 = tok('--s1'), s2 = tok('--s2');
  const lbl = ['0', ...C.rows.map(r => String(r.m))];
  const o = baseOpts();

          font(8, 'bold', BR); doc.text(T(r.t.toUpperCase()), x + 4, y + 6.5);
          font(9.5, 'normal', INK); doc.text(r.lines, x + 4, y + 12, { lineHeightFactor: 1.35 });
        });
        y += bh + gap;
      }
      y += 4;
    };
    const table = (head, body, o = {}) => {
      const est = (body.length + 1) * ((o.fs || 8.5) * 0.55 + 2 * (o.pad || 2.2)) + 4;
      ensure(est < 150 ? est : 18);
      const colStyles = {};
      (o.num || []).forEach(i => colStyles[i] = { halign: 'right' });
      Object.assign(colStyles, o.cols || {});
      doc.autoTable({
        startY: y, head: [head.map(T)], body: body.map(r => r.map(c => T(c))), margin: { left: M, right: M, top: TOP, bottom: H - BOT },
        theme: 'grid', rowPageBreak: 'avoid',
        styles: { font: 'helvetica', fontSize: o.fs || 8.5, cellPadding: o.pad || 2.2, textColor: INK, lineColor: LINE, lineWidth: 0.15, valign: 'middle', overflow: 'linebreak' },
        headStyles: { fillColor: BR, textColor: 255, fontStyle: 'bold', fontSize: (o.fs || 8.5) - 0.5 },
        alternateRowStyles: { fillColor: [248, 250, 248] },
        columnStyles: colStyles,
        didParseCell: d => {
          if (d.section !== 'body') return;
          if (o.bold && o.bold.includes(d.row.index)) { d.cell.styles.fontStyle = 'bold'; d.cell.styles.fillColor = TINT; }
          if (typeof d.cell.raw === 'string' && /^-R\$|^-\d/.test(d.cell.raw)) d.cell.styles.textColor = [184, 53, 53];
          if (o.status && d.column.index === o.status) {
            const v = d.cell.raw; d.cell.styles.fontStyle = 'bold';
            d.cell.styles.textColor = v === 'OK' ? [29, 127, 70] : v === 'Atenção' ? [154, 98, 0] : [184, 53, 53];
          }
        }
      });
      y = doc.lastAutoTable.finalY + 8;
    };
    const image = (url, h, title) => {
      ensure(h + (title ? 8 : 0) + 4);
      if (title) { font(9, 'bold', INK2); doc.text(T(title), M, y); y += 3; }
      doc.addImage(url, 'PNG', M, y, CW, h, undefined, 'FAST'); y += h + 6;
    };

    /* capa */
    doc.setFillColor(...BR); doc.rect(0, 0, W, 8, 'F'); doc.rect(0, H - 34, W, 34, 'F');
    if (logo) { const d = fit(lw, lh, 70, 40); doc.addImage(logo, 'PNG', M, 34, d.w, d.h, undefined, 'FAST'); }
    font(11, 'bold', BR); doc.text('PLANO DE NEGÓCIO', M, 112);
    font(32, 'bold'); const tl = doc.splitTextToSize(T(D.E.nome || 'Meu negócio'), CW); doc.text(tl, M, 126, { lineHeightFactor: 1.15 });
    let cy = 126 + tl.length * 13;
    font(13, 'normal', INK2); doc.text(T([D.E.segmento, D.E.cidade].filter(Boolean).join('  ·  ')), M, cy); cy += 14;
    if (D.E.descricao) { font(10.5, 'normal', INK2); const dl = doc.splitTextToSize(T(D.E.descricao), CW - 30); doc.text(dl, M, cy, { lineHeightFactor: 1.45 }); cy += dl.length * 5.5 + 10; }
    const vc = C.verdict === 'good' ? [29, 127, 70] : C.verdict === 'warn' ? [154, 98, 0] : [184, 53, 53];
    doc.setFillColor(...vc.map(c => Math.round(c + (255 - c) * 0.88))); doc.roundedRect(M, Math.max(cy, 196), CW, 26, 2, 2, 'F');
    font(8, 'bold', vc); doc.text('RESULTADO DA ANÁLISE DE VIABILIDADE', M + 6, Math.max(cy, 196) + 8);
    font(15, 'bold', vc); doc.text(T(D.verdict), M + 6, Math.max(cy, 196) + 17);
    font(9, 'normal', INK); doc.text(T(`VPL ${brl0(C.vpl)}   ·   TIR ${Number.isFinite(C.tirA) ? pct(C.tirA) + ' a.a.' : '—'}   ·   Payback ${Number.isFinite(C.pb) ? fN1.format(C.pb) + ' meses' : 'não retorna'}`), M + 70, Math.max(cy, 196) + 17);
    font(10, 'normal', [255, 255, 255]);
    doc.text(T([D.E.responsavel, D.E.formaJuridica].filter(Boolean).join('  ·  ')), M, H - 19);
    doc.text(T(dataHoje()), M, H - 13);

    /* 1. sumário executivo */
    section('Sumário executivo');
    para('Descrição do negócio', D.E.descricao);
    para('Oportunidade de mercado', D.E.oportunidade);
    sub('Principais indicadores'); kpis(D.kpis);
    para('Conclusão', `${D.verdict}. ${D.resumo}`);
    sub('Identificação');
    table(['Campo', 'Informação'], [['Forma jurídica / regime', D.E.formaJuridica], ['Responsável', D.E.responsavel], ['Início das operações', D.E.inicio ? rotuloMes(+D.E.inicio.slice(0, 4), +D.E.inicio.slice(5, 7) - 1, 1) : '']].filter(r => r[1]), { cols: { 0: { cellWidth: 55, fontStyle: 'bold' } } });
    sub('Identidade'); boxes([['Missão', D.E.missao], ['Visão', D.E.visao], ['Valores', D.E.valores]], 3);

    /* 2. SWOT */
    section('Análise SWOT');
    boxes([['Forças', D.E.forcas], ['Fraquezas', D.E.fraquezas], ['Oportunidades', D.E.oportunidades], ['Ameaças', D.E.ameacas]], 2);

    /* 3. MVP */
    const Mv = S.mvp;
    section('MVP: produto mínimo viável');
    para('Hipótese a validar', Mv.hipotese); para('Problema do cliente', Mv.problema); para('Critério de sucesso', Mv.metrica);
    kpis([['Custo total do MVP', brl0(C.mvp.custo), 'itens incluídos + divulgação'], ['Esforço', fN.format(C.mvp.horas) + ' h', Number.isFinite(C.mvp.semanas) ? `cerca de ${fN1.format(C.mvp.semanas)} semanas` : ''], ['Pedidos esperados', num(C.mvp.pedidos), `meta: ${num(n(Mv.metaPedidos))}`],
      ['Receita do teste', brl0(C.mvp.receita), ''], ['CAC no teste', brl(C.mvp.cac), 'verba ÷ pedidos'], ['No investimento inicial', S.investimento.incluirMvp ? 'Incluído' : 'Não incluído', '']]);
    sub('Escopo e priorização');
    table(['No MVP', 'Item', 'Prioridade', 'Horas', 'Custo direto', 'Total'], C.mvp.feats.map(f => [f.incluir ? 'Sim' : 'Não', f.nome, f.prio, fN1.format(n(f.horas)), brl(n(f.custo)), brl(f.total)]), { num: [3, 4, 5], cols: { 0: { cellWidth: 16 } } });

    /* 4. produtos */
    section('Produtos e formação de preço');
    table(['Premissa', 'Valor'], [['Impostos sobre a venda', pct(n(S.premissas.impostosPct) / 100, 2)], ['Comissão de vendas', pct(n(S.premissas.comissaoPct) / 100, 2)], ['Taxa média dos canais', pct(C.taxaCanais, 2)], ['Total de custos variáveis sobre a venda', pct(C.varPct, 2)], ['Rateio de custos fixos no preço', pct(C.rateioPct, 2)], ['Custo da hora de mão de obra direta', brl(n(S.operacional.custoHoraMO))]], { num: [1], bold: [3] });
    sub('Resumo de preços');
    table(['Produto', 'Custo direto', 'Markup', 'Preço sugerido', 'Preço adotado', 'Margem contrib.', 'Lucro %'], C.prods.map(x => [`${x.p.nome} (${x.p.unidade})`, brl(x.cd), Number.isFinite(x.markup) ? x.markup.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + 'x' : '—', brl(x.sugerido), brl(x.preco), `${brl(x.mcUnit)} (${pct(x.mcPct)})`, pct(x.margemReal)]), { num: [1, 2, 3, 4, 5, 6], fs: 8 });
    C.prods.forEach(x => {
      sub(`Ficha técnica: ${x.p.nome}`);
      table(['Insumo', 'Qtd./unidade', 'Unid.', 'Custo unit.', 'Custo'], [
        ...x.p.insumos.map(i => [i.nome, String(n(i.qtd)).replace('.', ','), i.unid, brl(n(i.custo)), brl(n(i.qtd) * n(i.custo))]),
        ['Mão de obra direta', fN1.format(n(x.p.minutosMO)) + ' min', '', '', brl(x.mo)], ['Embalagem + outros', '', '', '', brl(n(x.p.embalagem) + n(x.p.outros))],
        ['Custo direto unitário', '', '', '', brl(x.cd)], ['Preço de venda adotado', '', '', '', brl(x.preco)]
      ], { num: [1, 3, 4], bold: [x.p.insumos.length + 2, x.p.insumos.length + 3], fs: 8 });
    });

    /* 5. comercial */
    const Cm = S.comercial;
    section('Plano comercial');
    sub('Previsão de vendas');
    table(['Produto', 'Vendas mês 1', 'Cresc. a.m.', 'Preço', 'Unid. ano 1', 'Receita ano 1'], C.prods.map((x, i) => [x.p.nome, num(n(x.p.vendasMes1)), pct(n(x.p.crescimentoPct) / 100), brl(x.preco), num(sum(C.rows.filter(r => r.ano === 1), r => r.porProd[i].q)), brl0(sum(C.rows.filter(r => r.ano === 1), r => r.porProd[i].r))]), { num: [1, 2, 3, 4, 5] });
    para('', `Crescimento aplicado até o mês ${num(n(S.premissas.mesesCrescimento))}; depois o volume estabiliza e só varia com a sazonalidade e o reajuste anual de ${pct(n(S.premissas.inflacaoAnual) / 100)}.`);
    sub('Canais de venda');
    table(['Canal', 'Participação', 'Taxa'], [...Cm.canais.map(c => [c.canal, pct(n(c.part) / 100), pct(n(c.taxa) / 100, 2)]), ['Média ponderada', pct(sum(Cm.canais, c => c.part) / 100), pct(C.taxaCanais, 2)]], { num: [1, 2], bold: [Cm.canais.length] });
    sub('Sazonalidade (100% = mês normal)');
    table(['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'], [Cm.sazonalidade.map(v => fN.format(n(v)) + '%')], { fs: 8, cols: Object.fromEntries([...Array(12).keys()].map(i => [i, { halign: 'center' }])) });
    sub('Metas mensais do ano 1');
    const r12 = C.rows.slice(0, 12);
    table(['Produto', ...r12.map(r => r.label)], [...C.prods.map((x, i) => [x.p.nome, ...r12.map(r => num(r.porProd[i].q))]), ['Receita', ...r12.map(r => kbrl(r.receita).replace('R$ ', ''))]], { fs: 6.5, pad: 1.4, num: [...Array(12).keys()].map(i => i + 1), bold: [C.prods.length], cols: { 0: { cellWidth: 26 } } });
    para('Política comercial', Cm.politica); para('Prazos de recebimento', Cm.prazoRecebimento); para('Metas qualitativas', Cm.metas);

    /* 6. marketing */
    const Mk = S.marketing;
    section('Plano de marketing');
    para('Público-alvo', Mk.publico); para('Persona', Mk.persona); para('Posicionamento', Mk.posicionamento);
    sub('Composto de marketing (4 Ps)');
    boxes([['Produto', Mk.produto], ['Preço', Mk.preco], ['Praça', Mk.praca], ['Promoção', Mk.promocao]], 2);
    sub('Concorrentes');
    table(['Concorrente', 'Preço', 'Pontos fortes', 'Pontos fracos'], Mk.concorrentes.map(c => [c.nome, c.preco, c.fortes, c.fracos]), { cols: { 0: { fontStyle: 'bold', cellWidth: 34 }, 1: { cellWidth: 28 } } });
    sub('Orçamento mensal');
    table(['Ação', 'Canal', 'Valor por mês'], [...Mk.orcamento.map(o => [o.acao, o.canal, brl(n(o.valor))]), ['Total', '', brl(C.mkt)]], { num: [2], bold: [Mk.orcamento.length] });
    sub('Aquisição e retenção');
    kpis([['CAC', brl(C.cac), 'verba ÷ novos clientes'], ['LTV', brl(C.ltv), 'ticket × frequência × anos × MC%'], ['LTV / CAC', Number.isFinite(C.ltvCac) ? fN1.format(C.ltvCac) + 'x' : '—', 'meta: 3x ou mais']]);

    /* 7. operacional */
    const O = S.operacional;
    section('Plano operacional');
    kpis([['Custo fixo mensal', brl0(C.fixoTotal), 'folha + fixos + marketing + depreciação'], ['Folha com encargos', brl0(C.folha), `${num(sum(O.equipe, e => e.qtd))} pessoas`], ['Uso da capacidade', n(O.capacidadeMensal) > 0 ? pct(C.maxUnid / n(O.capacidadeMensal), 0) : '—', `pico de ${num(C.maxUnid)} un/mês`]]);
    para('Localização e instalações', O.localizacao);
    para('Processo operacional', O.processos);
    sub('Equipe');
    table(['Cargo', 'Qtd.', 'Salário', 'Custo com encargos'], [...O.equipe.map(e => [e.cargo, num(n(e.qtd)), brl(n(e.salario)), brl(n(e.qtd) * n(e.salario) * (1 + n(O.encargosPct) / 100))]), ['Total (encargos de ' + pct(n(O.encargosPct) / 100, 0) + ')', '', '', brl(C.folha)]], { num: [1, 2, 3], bold: [O.equipe.length] });
    sub('Custos fixos mensais');
    table(['Item', 'Valor por mês'], [...O.custosFixos.map(c => [c.item, brl(n(c.valor))]), ['Total', brl(C.fixosItens)]], { num: [1], bold: [O.custosFixos.length] });
    sub('Fornecedores');
    table(['Fornecedor', 'O que fornece', 'Prazo', 'Condição'], O.fornecedores.map(f => [f.nome, f.item, f.prazo, f.condicao]));

    /* 8. investimento */
    const I = S.investimento;
    section('Investimento inicial');
    kpis([['Investimento total', brl0(C.inv.total), ''], ['Capital próprio', brl0(C.inv.proprio), pct(C.inv.proprio / C.inv.total, 0) + ' do total'], ['Financiado', brl0(C.inv.fin), C.inv.fin > 0 ? `${num(n(I.fin.prazo))}x · ${pct(n(I.fin.taxa) / 100, 2)} a.m.` : '']]);
    sub('Composição');
    table(['Grupo', 'Valor', '% do total'], [['Investimentos fixos', brl0(C.inv.fixos), pct(C.inv.fixos / C.inv.total)], ['Despesas pré-operacionais', brl0(C.inv.preop), pct(C.inv.preop / C.inv.total)], [`Capital de giro (${num(n(I.mesesGiro))} meses de custos fixos)`, brl0(C.inv.giro), pct(C.inv.giro / C.inv.total)], ['MVP', brl0(C.inv.mvp), pct(C.inv.mvp / C.inv.total)], ['Total', brl0(C.inv.total), '100%']], { num: [1, 2], bold: [4] });
    sub('Investimentos fixos');
    table(['Item', 'Qtd.', 'Valor unit.', 'Vida útil', 'Total'], [...I.fixos.map(f => [f.item, num(n(f.qtd)), brl(n(f.valor)), n(f.vida) + ' anos', brl(n(f.qtd) * n(f.valor))]), ['Total', '', '', `deprec. ${brl(C.deprec)}/mês`, brl(C.inv.fixos)]], { num: [1, 2, 3, 4], bold: [I.fixos.length] });
    sub('Despesas pré-operacionais');
    table(['Item', 'Valor'], [...I.preop.map(p => [p.item, brl(n(p.valor))]), ['Total', brl(C.inv.preop)]], { num: [1], bold: [I.preop.length] });
    if (C.inv.fin > 0) {
      sub('Financiamento');
      table(['Condição', 'Valor'], [['Valor financiado', brl0(C.inv.fin)], ['Juros', pct(n(I.fin.taxa) / 100, 2) + ' ao mês'], ['Prazo total', num(n(I.fin.prazo)) + ' meses'], ['Carência (só juros)', num(C.inv.fCar) + ' meses'], ['Parcela após a carência', brl(C.inv.pmt)], ['Juros totais pagos', brl0(sum(C.rows, r => r.juros))]], { num: [1] });
    }

    /* 9. financeiro */
    const P = S.premissas;
    section('Plano financeiro');
    table(['Premissa', 'Valor'], [['TMA (taxa mínima de atratividade)', pct(n(P.tmaAnual) / 100) + ' a.a.'], ['Inflação / reajuste anual', pct(n(P.inflacaoAnual) / 100)], ['Horizonte da análise', C.H + ' meses'], ['IR/CSLL sobre o lucro', pct(n(P.irPct) / 100)]], { num: [1] });
    sub('Demonstração de resultado (DRE) anual');
    table(['Conta', ...C.anos.map(a => 'Ano ' + a.ano + (a.meses < 12 ? ` (${a.meses}m)` : ''))], D.dre.map(r => [r.l, ...r.vals]), { num: C.anos.map((_, i) => i + 1), bold: D.dre.map((r, i) => r.b ? i : -1).filter(i => i >= 0), fs: C.anos.length > 6 ? 6.5 : 8, cols: { 0: { cellWidth: 52 } } });
    image(G.receita, CW * 0.45, 'Receita bruta × custos totais por mês');
    image(G.anual, CW * 0.45, 'Receita bruta e lucro líquido por ano');

    /* 10. viabilidade */
    section('Análise de viabilidade');
    {
      ensure(24);
      doc.setFillColor(...vc.map(c => Math.round(c + (255 - c) * 0.88)));
      font(10); const rl = doc.splitTextToSize(T(D.resumo), CW - 62);
      const bh = Math.max(20, rl.length * 5 + 10);
      doc.roundedRect(M, y, CW, bh, 2, 2, 'F');
      font(15, 'bold', vc); doc.text(T(D.verdict), M + 6, y + bh / 2 + 2);
      font(10, 'normal', INK); doc.text(rl, M + 58, y + 7.5, { lineHeightFactor: 1.4 });
      y += bh + 8;
    }
    kpis([['VPL', brl0(C.vpl), 'valor criado acima da TMA'], ['TIR', Number.isFinite(C.tirA) ? pct(C.tirA) + ' a.a.' : '—', Number.isFinite(C.tirM) ? pct(C.tirM, 2) + ' a.m.' : ''], ['Payback simples', Number.isFinite(C.pb) ? fN1.format(C.pb) + ' meses' : 'não retorna', Number.isFinite(C.pb) ? fN1.format(C.pb / 12) + ' anos' : ''],
      ['Payback descontado', Number.isFinite(C.pbD) ? fN1.format(C.pbD) + ' meses' : 'não retorna', ''], ['Rentabilidade', pct(C.rentab) + ' a.a.', 'lucro médio anual ÷ investimento'], ['ROI no horizonte', pct(C.roi, 0), `em ${C.H} meses`]]);
    sub('Critérios avaliados');
    table(['Critério', 'Resultado', 'Status', 'Observação'], C.checks.map(c => [c.nome, c.val, D.statusTxt[c.ok], c.info]), { status: 2, fs: 8, cols: { 0: { cellWidth: 50 }, 1: { cellWidth: 32 }, 2: { cellWidth: 18 } } });
    sub('Ponto de equilíbrio (média mensal do ano 1)');
    table(['Indicador', 'Valor'], [['PE contábil', brl0(C.peR) + '/mês'], ['PE econômico (inclui a TMA)', brl0(C.peEcon) + '/mês'], ['Receita média prevista', brl0(C.receitaMes1) + '/mês'], ['Margem de segurança', pct(C.margemSeg)], ['Margem de contribuição', pct(C.mcPct1)], ['Primeiro mês com lucro operacional', C.mesEquilibrio ? 'mês ' + C.mesEquilibrio : 'não atinge'],
      ...C.prods.map((x, i) => [`Volume no PE: ${x.p.nome}`, `${num(C.peUnid[i])} ${x.p.unidade}/mês (${num(C.peUnid[i] / 26)}/dia)`])], { num: [1] });
    image(G.payback, CW * 0.45, 'Tempo de retorno: fluxo de caixa acumulado (meses)');

    /* cabeçalho e rodapé */
    const total = doc.getNumberOfPages();
    for (let p = 2; p <= total; p++) {
      doc.setPage(p);
      if (logo) { const d = fit(lw, lh, 28, 9); doc.addImage(logo, 'PNG', M, 10, d.w, d.h, undefined, 'FAST'); }
      else { font(9, 'bold', BR); doc.text(T(D.E.nome), M, 16); }
      font(8, 'normal', MUT); doc.text(T(`Plano de negócio  ·  ${D.E.nome}`), W - M, 16, { align: 'right' });
      doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, 21, W - M, 21);
      doc.line(M, H - 14, W - M, H - 14);
      font(7.5, 'normal', MUT); doc.text(T(dataHoje()), M, H - 9); doc.text(`${p} / ${total}`, W - M, H - 9, { align: 'right' });
    }
    doc.save(fileBase() + '-plano-de-negocio.pdf');
    toast('PDF gerado');
  } catch (e) { console.error(e); toast('Não foi possível gerar o PDF: ' + e.message); }
  finally { unbusy(btn); }
}

/* ============================================================
   PowerPoint
   ============================================================ */
async function gerarPPT(btn) {
  busy(btn, 'Gerando PowerPoint…');
  try {
    await loadScript(LIBS.pptx);
    const D = reportData();
    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_WIDE'; // 13,33 × 7,5 pol
    pptx.title = 'Plano de negócio · ' + (D.E.nome || ''); pptx.company = D.E.nome || ''; pptx.author = D.E.responsavel || '';
    const SW = 13.333, X = 0.6, CW = SW - 2 * X;
    const BR = rgbHex(D.cor), TINT = rgbHex(mix(D.cor, 0.9)), TINT2 = rgbHex(mix(D.cor, 0.95));
    const INK = '15201B', INK2 = '48564E', MUT = '76837B', LINE = 'D6DDD7', WHITE = 'FFFFFF';
    const F = 'Calibri';
    const logo = S.empresa.logo, lw = n(S.empresa.logoW) || 3, lh = n(S.empresa.logoH) || 1;
    const SC = { good: '1D7F46', warn: '9A6200', bad: 'B83535' }, SB = { good: 'DCF1E3', warn: 'FBECC9', bad: 'F8DDDD' };

    const masterObjs = [
      { rect: { x: 0, y: 0, w: SW, h: 0.1, fill: { color: BR } } },
      { line: { x: X, y: 7.0, w: CW, h: 0, line: { color: LINE, width: 0.75 } } },
      { text: { text: `Plano de negócio · ${D.E.nome || ''}`, options: { x: X, y: 7.05, w: 8, h: 0.3, fontFace: F, fontSize: 10, color: MUT } } }
    ];
    if (logo) { const d = fit(lw, lh, 1.6, 0.6); masterObjs.push({ image: { data: logo, x: SW - X - d.w, y: 0.35, w: d.w, h: d.h } }); }
    pptx.defineSlideMaster({ title: 'CONTEUDO', background: { color: WHITE }, objects: masterObjs, slideNumber: { x: SW - X - 0.6, y: 7.05, w: 0.6, h: 0.3, fontFace: F, fontSize: 10, color: MUT, align: 'right' } });

    let secN = 0;
    const slide = (title, eyebrow) => {
      const s = pptx.addSlide({ masterName: 'CONTEUDO' });
      s.addText((eyebrow || String(++secN).padStart(2, '0') + ' · PLANO DE NEGÓCIO').toUpperCase(), { x: X, y: 0.35, w: 9, h: 0.3, fontFace: F, fontSize: 11, bold: true, color: BR, charSpacing: 2, margin: 0 });
      s.addText(title, { x: X, y: 0.65, w: 10, h: 0.7, fontFace: F, fontSize: 30, bold: true, color: INK, margin: 0 });
      return s;
    };
    const cards = (s, items, { x = X, y = 1.7, w = CW, cols = 3, h = 1.15, gap = 0.2 } = {}) => {
      const bw = (w - gap * (cols - 1)) / cols;
      items.forEach(([l, v, d], i) => {
        const cx = x + (i % cols) * (bw + gap), cy = y + Math.floor(i / cols) * (h + gap);
        s.addShape(pptx.ShapeType.roundRect, { x: cx, y: cy, w: bw, h, fill: { color: TINT2 }, line: { color: LINE, width: 0.75 }, rectRadius: 0.08 });
        s.addText([
          { text: l.toUpperCase(), options: { fontSize: 10, bold: true, color: MUT, charSpacing: 1, breakLine: true } },
          { text: v, options: { fontSize: 22, bold: true, color: INK, breakLine: !!d } },
          ...(d ? [{ text: d, options: { fontSize: 10.5, color: INK2 } }] : [])
        ], { x: cx + 0.15, y: cy + 0.08, w: bw - 0.3, h: h - 0.16, fontFace: F, valign: 'middle', margin: 0, paraSpaceAfter: 2 });
      });
    };
    const textBoxes = (s, items, { x = X, y = 1.7, w = CW, cols = 2, h = 2.4, gap = 0.25, fs = 13 } = {}) => {
      const bw = (w - gap * (cols - 1)) / cols;
      items.forEach(([t, txt, fill], i) => {
        const cx = x + (i % cols) * (bw + gap), cy = y + Math.floor(i / cols) * (h + gap);
        s.addShape(pptx.ShapeType.roundRect, { x: cx, y: cy, w: bw, h, fill: { color: fill || TINT2 }, line: { color: LINE, width: 0.75 }, rectRadius: 0.08 });
        s.addText([{ text: t.toUpperCase(), options: { fontSize: 11, bold: true, color: BR, charSpacing: 1, breakLine: true } }, { text: txt || '—', options: { fontSize: fs, color: INK } }],
          { x: cx + 0.2, y: cy + 0.15, w: bw - 0.4, h: h - 0.3, fontFace: F, valign: 'top', margin: 0, paraSpaceAfter: 6, fit: 'shrink' });
      });
    };
    const tbl = (s, head, rows, { x = X, y = 1.7, w = CW, colW, num = [], bold = [], fs = 12, status } = {}) => {
      const hdr = head.map((h, i) => ({ text: h, options: { bold: true, color: WHITE, fill: { color: BR }, align: num.includes(i) ? 'right' : 'left' } }));
      const body = rows.map((r, ri) => r.map((c, i) => {
        const o = { color: INK, align: num.includes(i) ? 'right' : 'left', fill: { color: bold.includes(ri) ? TINT : ri % 2 ? 'F8FAF8' : WHITE }, bold: bold.includes(ri) };
        if (typeof c === 'string' && /^-R\$|^-\d/.test(c)) o.color = 'B83535';
        if (status != null && i === status) { o.color = SC[c[1]]; o.bold = true; c = c[0]; }
        return { text: String(c ?? ''), options: o };
      }));
      s.addTable([hdr, ...body], { x, y, w, colW, fontFace: F, fontSize: fs, border: { type: 'solid', color: LINE, pt: 0.75 }, margin: [3, 6, 3, 6], valign: 'middle', autoPage: false });
    };
    const chartOpts = (o = {}) => ({
      x: X, y: 1.6, w: CW, h: 5.1, fontFace: F, showLegend: true, legendPos: 't', legendFontSize: 12, legendColor: INK2,
      catAxisLabelColor: INK2, valAxisLabelColor: INK2, catAxisLabelFontSize: 11, valAxisLabelFontSize: 11,
      valAxisLabelFormatCode: '"R$" #,##0', valGridLine: { color: 'E5E9E5', size: 0.75 }, catGridLine: { style: 'none' },
      catAxisLineShow: true, valAxisLineShow: false, ...o
    });

    /* capa */
    {
      const s = pptx.addSlide();
      s.background = { color: BR };
      s.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 5.2, h: 7.5, fill: { color: WHITE } });
      if (logo) { const d = fit(lw, lh, 3.8, 2.6); s.addImage({ data: logo, x: (5.2 - d.w) / 2, y: (7.5 - d.h) / 2, w: d.w, h: d.h }); }
      else s.addText(D.E.nome || '', { x: 0.5, y: 3, w: 4.2, h: 1.5, fontFace: F, fontSize: 28, bold: true, color: BR, align: 'center', valign: 'middle' });
      s.addText('PLANO DE NEGÓCIO', { x: 5.9, y: 2.0, w: 7, h: 0.4, fontFace: F, fontSize: 14, bold: true, color: WHITE, charSpacing: 4, margin: 0 });
      s.addText(D.E.nome || 'Meu negócio', { x: 5.9, y: 2.45, w: 7, h: 1.5, fontFace: F, fontSize: 44, bold: true, color: WHITE, valign: 'top', margin: 0, fit: 'shrink' });
      s.addText([D.E.segmento, D.E.cidade].filter(Boolean).join('  ·  '), { x: 5.9, y: 4.0, w: 7, h: 0.45, fontFace: F, fontSize: 18, color: WHITE, margin: 0 });
      s.addText([D.E.responsavel, dataHoje()].filter(Boolean).join('  ·  '), { x: 5.9, y: 6.5, w: 7, h: 0.4, fontFace: F, fontSize: 13, color: WHITE, margin: 0 });
    }

    /* sumário */
    {
      const s = slide('Sumário executivo');
      s.addText([{ text: 'O NEGÓCIO', options: { fontSize: 11, bold: true, color: BR, charSpacing: 1, breakLine: true } }, { text: D.E.descricao || '—', options: { fontSize: 14, color: INK, breakLine: true } },
        { text: ' ', options: { fontSize: 8, breakLine: true } },
        { text: 'OPORTUNIDADE', options: { fontSize: 11, bold: true, color: BR, charSpacing: 1, breakLine: true } }, { text: D.E.oportunidade || '—', options: { fontSize: 14, color: INK } }],
        { x: X, y: 1.7, w: 4.4, h: 5.0, fontFace: F, valign: 'top', margin: 0, paraSpaceAfter: 4, fit: 'shrink' });
      cards(s, D.kpis.slice(0, 6), { x: 5.3, w: SW - 5.3 - X, cols: 2, h: 1.45, gap: 0.2 });
    }
    /* identidade */
    { const s = slide('Missão, visão e valores'); textBoxes(s, [['Missão', D.E.missao], ['Visão', D.E.visao], ['Valores', D.E.valores]], { cols: 3, h: 4.6, fs: 16 }); }
    /* SWOT */
    { const s = slide('Análise SWOT'); textBoxes(s, [['Forças', D.E.forcas, 'E6F4EA'], ['Fraquezas', D.E.fraquezas, 'FBEFE0'], ['Oportunidades', D.E.oportunidades, 'E3EEFB'], ['Ameaças', D.E.ameacas, 'FBE5E5']], { cols: 2, h: 2.4 }); }
    /* MVP */
    {
      const s = slide('MVP: produto mínimo viável');
      s.addText([{ text: 'HIPÓTESE', options: { fontSize: 11, bold: true, color: BR, breakLine: true } }, { text: S.mvp.hipotese || '—', options: { fontSize: 14, color: INK } }], { x: X, y: 1.55, w: CW, h: 0.8, fontFace: F, margin: 0, fit: 'shrink' });
      const feats = C.mvp.feats.slice(0, 8);
      tbl(s, ['No MVP', 'Item', 'Prioridade', 'Horas', 'Total'], feats.map(f => [f.incluir ? 'Sim' : 'Não', f.nome, f.prio, fN1.format(n(f.horas)), brl0(f.total)]), { y: 2.5, w: 7.6, colW: [0.9, 3.8, 1.1, 0.8, 1.0], num: [3, 4], fs: 11 });
      cards(s, [['Custo do MVP', brl0(C.mvp.custo)], ['Esforço', fN.format(C.mvp.horas) + ' h', Number.isFinite(C.mvp.semanas) ? `${fN1.format(C.mvp.semanas)} semanas` : ''], ['Pedidos esperados', num(C.mvp.pedidos), `meta: ${num(n(S.mvp.metaPedidos))}`], ['CAC no teste', brl(C.mvp.cac)]], { x: 8.5, y: 2.5, w: SW - 8.5 - X, cols: 1, h: 0.95, gap: 0.12 });
    }
    /* produtos */
    {
      const s = slide('Produtos e formação de preço');
      tbl(s, ['Produto', 'Custo direto', 'Markup', 'Preço adotado', 'Margem contrib.', 'Lucro %'], C.prods.slice(0, 8).map(x => [x.p.nome, brl(x.cd), Number.isFinite(x.markup) ? x.markup.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '×' : '—', brl(x.preco), `${brl(x.mcUnit)} (${pct(x.mcPct)})`, pct(x.margemReal)]), { num: [1, 2, 3, 4, 5], colW: [3.6, 1.6, 1.2, 1.8, 2.4, 1.53] });
      s.addText(`Preço = custo direto ÷ (1 − ${pct(C.varPct)} de custos variáveis − ${pct(C.rateioPct)} de rateio dos fixos − margem desejada)`, { x: X, y: 6.3, w: CW, h: 0.4, fontFace: F, fontSize: 12, color: INK2, margin: 0 });
    }
    {
      const s = slide('Custo × preço por unidade');
      s.addChart(pptx.ChartType.bar, [{ name: 'Custo direto', labels: C.prods.map(x => x.p.nome), values: C.prods.map(x => +x.cd.toFixed(2)) }, { name: 'Preço adotado', labels: C.prods.map(x => x.p.nome), values: C.prods.map(x => +(x.preco || 0).toFixed(2)) }],
        chartOpts({ barDir: 'col', barGrouping: 'clustered', chartColors: ['EB6834', '2A78D6'], valAxisLabelFormatCode: '"R$" #,##0.00', showValue: true, dataLabelFormatCode: '"R$" #,##0.00', dataLabelFontSize: 11, dataLabelColor: INK2, barGapWidthPct: 60 }));
    }
    /* comercial */
    {
      const s = slide('Plano comercial');
      const r12 = C.rows.slice(0, 12);
      s.addChart(pptx.ChartType.bar, [{ name: 'Receita bruta', labels: r12.map(r => r.label), values: r12.map(r => Math.round(r.receita)) }], chartOpts({ x: X, y: 1.6, w: 7.3, h: 5.1, barDir: 'col', chartColors: ['2A78D6'], showLegend: false, showTitle: true, title: 'Receita prevista no ano 1', titleFontSize: 13, titleColor: INK2 }));
      tbl(s, ['Canal', 'Part.', 'Taxa'], S.comercial.canais.slice(0, 7).map(c => [c.canal, pct(n(c.part) / 100, 0), pct(n(c.taxa) / 100, 1)]), { x: 8.2, y: 1.8, w: SW - 8.2 - X, colW: [2.6, 0.9, 0.93], num: [1, 2], fs: 12 });
      s.addText([{ text: 'POLÍTICA COMERCIAL', options: { fontSize: 10, bold: true, color: BR, breakLine: true } }, { text: S.comercial.politica || '—', options: { fontSize: 11.5, color: INK } }], { x: 8.2, y: 4.3, w: SW - 8.2 - X, h: 2.4, fontFace: F, valign: 'top', margin: 0, fit: 'shrink' });
    }
    /* marketing */
    {
      const Mk = S.marketing;
      const s = slide('Plano de marketing');
      textBoxes(s, [['Produto', Mk.produto], ['Preço', Mk.preco], ['Praça', Mk.praca], ['Promoção', Mk.promocao]], { cols: 2, w: 8.3, h: 2.4, fs: 13 });
      cards(s, [['Verba mensal', brl0(C.mkt)], ['CAC', brl(C.cac)], ['LTV', brl(C.ltv)], ['LTV / CAC', Number.isFinite(C.ltvCac) ? fN1.format(C.ltvCac) + '×' : '—', 'meta: 3× ou mais']], { x: 9.2, w: SW - 9.2 - X, cols: 1, h: 1.08, gap: 0.16 });
    }
    {
      const Mk = S.marketing;
      const s = slide('Público, concorrência e orçamento');
      s.addText([{ text: 'PÚBLICO-ALVO', options: { fontSize: 10, bold: true, color: BR, breakLine: true } }, { text: Mk.publico || '—', options: { fontSize: 12, color: INK, breakLine: true } }, { text: ' ', options: { fontSize: 6, breakLine: true } }, { text: 'POSICIONAMENTO', options: { fontSize: 10, bold: true, color: BR, breakLine: true } }, { text: Mk.posicionamento || '—', options: { fontSize: 12, color: INK } }], { x: X, y: 1.6, w: CW, h: 1.4, fontFace: F, valign: 'top', margin: 0, fit: 'shrink' });
      tbl(s, ['Concorrente', 'Preço', 'Pontos fortes', 'Pontos fracos'], Mk.concorrentes.slice(0, 5).map(c => [c.nome, c.preco, c.fortes, c.fracos]), { y: 3.15, w: 7.4, colW: [1.6, 1.3, 2.25, 2.25], fs: 10.5 });
      tbl(s, ['Ação', 'R$/mês'], [...Mk.orcamento.slice(0, 6).map(o => [o.acao, brl0(n(o.valor))]), ['Total', brl0(C.mkt)]], { x: 8.3, y: 3.15, w: SW - 8.3 - X, colW: [3.03, 1.4], num: [1], bold: [Math.min(6, Mk.orcamento.length)], fs: 11 });
    }
    /* operacional */
    {
      const O = S.operacional;
      const s = slide('Plano operacional');
      cards(s, [['Custo fixo mensal', brl0(C.fixoTotal), 'com marketing e depreciação'], ['Folha com encargos', brl0(C.folha), `${num(sum(O.equipe, e => e.qtd))} pessoas`], ['Uso da capacidade', n(O.capacidadeMensal) > 0 ? pct(C.maxUnid / n(O.capacidadeMensal), 0) : '—', `pico de ${num(C.maxUnid)} un/mês`]], { h: 1.1 });
      tbl(s, ['Cargo', 'Qtd.', 'Custo c/ encargos'], [...O.equipe.slice(0, 6).map(e => [e.cargo, num(n(e.qtd)), brl0(n(e.qtd) * n(e.salario) * (1 + n(O.encargosPct) / 100))]), ['Total', '', brl0(C.folha)]], { y: 3.1, w: 5.6, colW: [2.9, 0.8, 1.9], num: [1, 2], bold: [Math.min(6, O.equipe.length)], fs: 11 });
      const cf = O.custosFixos.slice(0, 10);
      tbl(s, ['Custo fixo', 'R$/mês'], [...cf.map(c => [c.item, brl0(n(c.valor))]), ['Total', brl0(C.fixosItens)]], { x: 6.6, y: 3.1, w: SW - 6.6 - X, colW: [4.2, 1.93], num: [1], bold: [cf.length], fs: 10.5 });
    }
    /* investimento */
    {
      const s = slide('Investimento inicial');
      const it = [['Investimentos fixos', C.inv.fixos], ['Pré-operacional', C.inv.preop], ['Capital de giro', C.inv.giro], ['MVP', C.inv.mvp]].filter(x => x[1] > 0);
      s.addChart(pptx.ChartType.bar, [{ name: 'Valor', labels: it.map(x => x[0]), values: it.map(x => Math.round(x[1])) }], chartOpts({ x: X, y: 1.6, w: 7, h: 5.1, barDir: 'bar', chartColors: [BR], showLegend: false, showValue: true, dataLabelFormatCode: '"R$" #,##0', dataLabelFontSize: 12, dataLabelColor: INK2, catAxisLabelFontSize: 12 }));
      cards(s, [['Investimento total', brl0(C.inv.total)], ['Capital próprio', brl0(C.inv.proprio), pct(C.inv.proprio / C.inv.total, 0) + ' do total'], ['Financiado', brl0(C.inv.fin), C.inv.fin > 0 ? `${num(n(S.investimento.fin.prazo))}x de ${brl0(C.inv.pmt)} · ${pct(n(S.investimento.fin.taxa) / 100, 2)} a.m.` : 'sem financiamento']], { x: 8.0, w: SW - 8.0 - X, cols: 1, h: 1.45, gap: 0.2 });
    }
    /* DRE */
    {
      const s = slide('Demonstração de resultado (DRE)');
      const anos = C.anos.slice(0, 6);
      const rows = D.dre.filter(r => r.l !== 'Saldo de caixa no fim do ano');
      const fw = (CW - 3.6) / anos.length;
      tbl(s, ['Conta', ...anos.map(a => 'Ano ' + a.ano)], rows.map(r => [r.l, ...r.vals.slice(0, 6)]), { colW: [3.6, ...anos.map(() => fw)], num: anos.map((_, i) => i + 1), bold: rows.map((r, i) => r.b ? i : -1).filter(i => i >= 0), fs: 11 });
    }
    /* gráficos */
    {
      const s = slide('Receita × custos totais');
      const step = C.H > 36 ? 3 : 1, rs = C.rows.filter((r, i) => i % step === 0);
      s.addChart(pptx.ChartType.line, [{ name: 'Receita bruta', labels: rs.map(r => r.label), values: rs.map(r => Math.round(r.receita)) }, { name: 'Custos totais', labels: rs.map(r => r.label), values: rs.map(r => Math.round(r.custosTot)) }],
        chartOpts({ chartColors: ['2A78D6', 'EB6834'], lineSize: 3, lineDataSymbol: 'none', catAxisLabelFrequency: 2 }));
    }
    {
      const s = slide('Tempo de retorno do investimento');
      const lbl = ['0', ...C.rows.map(r => String(r.m))];
      s.addChart(pptx.ChartType.line, [{ name: 'Acumulado simples', labels: lbl, values: C.fluxos.map((_, i) => Math.round(i === 0 ? C.fluxos[0] : C.rows[i - 1].acc)) }, { name: 'Acumulado descontado', labels: lbl, values: C.fluxos.map((_, i) => Math.round(i === 0 ? C.fluxos[0] : C.rows[i - 1].accD)) }],
        chartOpts({ w: 8.6, chartColors: ['2A78D6', 'EB6834'], lineSize: 3, lineDataSymbol: 'none', catAxisLabelFrequency: 6, catAxisTitle: 'meses', showCatAxisTitle: true, catAxisTitleFontSize: 11, catAxisTitleColor: MUT }));
      cards(s, [['Payback simples', Number.isFinite(C.pb) ? fN1.format(C.pb) + ' meses' : 'não retorna', Number.isFinite(C.pb) ? fN1.format(C.pb / 12) + ' anos' : ''], ['Payback descontado', Number.isFinite(C.pbD) ? fN1.format(C.pbD) + ' meses' : 'não retorna', `pela TMA de ${pct(n(S.premissas.tmaAnual) / 100)} a.a.`], ['Equilíbrio operacional', C.mesEquilibrio ? 'mês ' + C.mesEquilibrio : 'não atinge', 'primeiro mês com lucro']], { x: 9.5, w: SW - 9.5 - X, cols: 1, h: 1.5, gap: 0.2 });
    }
    /* viabilidade */
    {
      const s = slide('Análise de viabilidade');
      cards(s, [['VPL', brl0(C.vpl)], ['TIR', Number.isFinite(C.tirA) ? pct(C.tirA) + ' a.a.' : '—'], ['Payback', Number.isFinite(C.pb) ? fN1.format(C.pb) + ' meses' : 'não retorna'], ['Ponto de equilíbrio', brl0(C.peR) + '/mês'], ['Margem de segurança', pct(C.margemSeg)], ['Rentabilidade', pct(C.rentab) + ' a.a.']], { x: X, w: 5.4, cols: 2, h: 1.5, gap: 0.2 });
      tbl(s, ['Critério', 'Resultado', 'Status'], C.checks.map(c => [c.nome, c.val, [D.statusTxt[c.ok], c.ok]]), { x: 6.3, w: SW - 6.3 - X, colW: [3.33, 1.9, 1.2], status: 2, fs: 11 });
    }
    /* conclusão */
    {
      const s = slide('Conclusão');
      const v = C.verdict;
      s.addShape(pptx.ShapeType.roundRect, { x: X, y: 1.8, w: CW, h: 3.2, fill: { color: SB[v] }, line: { color: SB[v] }, rectRadius: 0.1 });
      s.addText(D.verdict, { x: X + 0.4, y: 2.1, w: CW - 0.8, h: 0.9, fontFace: F, fontSize: 36, bold: true, color: SC[v], margin: 0 });
      s.addText(D.resumo, { x: X + 0.4, y: 3.05, w: CW - 0.8, h: 1.7, fontFace: F, fontSize: 18, color: INK, valign: 'top', margin: 0, fit: 'shrink' });
      s.addText(`Investimento de ${brl0(C.inv.total)} · VPL de ${brl0(C.vpl)} · TIR de ${Number.isFinite(C.tirA) ? pct(C.tirA) + ' a.a.' : '—'} · payback em ${Number.isFinite(C.pb) ? fN1.format(C.pb) + ' meses' : 'mais que o horizonte'}`, { x: X, y: 5.4, w: CW, h: 0.5, fontFace: F, fontSize: 14, color: INK2, margin: 0 });
    }
    await pptx.writeFile({ fileName: fileBase() + '-plano-de-negocio.pptx' });
    toast('PowerPoint gerado');
  } catch (e) { console.error(e); toast('Não foi possível gerar o PowerPoint: ' + e.message); }
  finally { unbusy(btn); }
}
</script>
</body>
</html>
